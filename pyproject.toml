[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikibridge"
version = "0.1.0"
description = "Importa wiki esterne (MediaWiki, Confluence, Notion, HTML) e documenti locali in una LLM Wiki markdown organizzata per progetti."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "trafilatura>=1.8",
    "markitdown>=0.1",
    "flask>=3.0",
    "flask-cors>=4.0",
    "python-slugify>=8.0",
    "pyyaml>=6.0",
    "browser-cookie3>=0.19",
    "ldap3>=2.9",
    "PyJWT[crypto]>=2.8",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
server = ["waitress>=3.0"]
saml = ["python3-saml>=1.16"]   # identity_provider=saml (xmlsec nativo: wheel per Windows/Linux)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
wikibridge = "wikibridge.cli:main"

[tool.setuptools.packages.find]
include = ["wikibridge*"]
